[project]
name = "project-name"
version = "0.1.0"
description = "One-line description"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyspark",
    "matplotlib",
]

[project.optional-dependencies]
databricks = ["databricks-connect"]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]